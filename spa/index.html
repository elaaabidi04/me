<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 2026-11-11: the "me" logo instead of Vite's default lightning bolt -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>me</title>
    <!-- 2026-08-20: every view references var(--font-display)/'Fraunces' and
         var(--font-ui)/'Instrument Sans', but nothing ever actually loaded
         them -- the whole app has been silently falling back to Georgia/
         system-ui since day one. Loading once here fixes it app-wide
         instead of per-component. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
